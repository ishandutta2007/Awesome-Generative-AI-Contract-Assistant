<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 15s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8 12;
        animation: dash 20s linear infinite;
      }
      .pulse-node {
        animation: pulseScale 3s ease-in-out infinite alternate;
      }
      .scanner-beam {
        animation: scanMove 4s ease-in-out infinite alternate;
      }
      .pill {
        transition: transform 0.3s ease;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseScale {
        0% { r: 4; opacity: 0.6; }
        100% { r: 7; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#blurFilter)">
    <circle class="orb-1" cx="220" cy="140" r="160" fill="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="260" r="180" fill="url(#glowPurple)" />
  </g>

  <!-- Tech Grid Background -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Data Flows / Wave Lines (Background decorative) -->
  <path class="flow-pulse" d="M -50 310 Q 300 240 600 320 T 1250 250" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  <path class="flow-pulse" d="M -50 340 Q 350 390 750 300 T 1250 330" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" />

  <!-- Scanning Beam Effect on Right Side -->
  <g transform="translate(920, 90)">
    <rect width="200" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Mini Document Representation -->
    <rect x="25" y="25" width="90" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="25" y="45" width="150" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
    <rect x="25" y="60" width="135" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
    <rect x="25" y="75" width="140" height="5" rx="2.5" fill="#ef4444" opacity="0.7" />
    <rect x="25" y="90" width="110" height="5" rx="2.5" fill="#10b981" opacity="0.7" />
    <rect x="25" y="105" width="145" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
    <rect x="25" y="120" width="130" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
    <rect x="25" y="135" width="85" height="5" rx="2.5" fill="#818cf8" opacity="0.7" />
    <rect x="25" y="150" width="125" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
    <rect x="25" y="165" width="100" height="5" rx="2.5" fill="#64748b" opacity="0.6" />

    <!-- Scanning beam line -->
    <line class="scanner-beam" x1="10" y1="15" x2="190" y2="15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="drop-shadow(0 0 5px #38bdf8)" />
  </g>

  <!-- Contract Redline Node Connector Diagram (Left side decoration) -->
  <g transform="translate(80, 110)">
    <rect width="130" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle class="pulse-node" cx="65" cy="45" r="5" fill="#38bdf8" />
    <circle class="pulse-node" cx="40" cy="110" r="5" fill="#a855f7" />
    <circle class="pulse-node" cx="90" cy="110" r="5" fill="#10b981" />
    <path d="M 65 45 L 40 110 M 65 45 L 90 110" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="65" y="145" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">REASONING</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Feature Pills -->
  <!-- Top Category Tag -->
  <g transform="translate(250, 68)">
    <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="30" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED LEGAL TECH &amp; AGENTS</text>
  </g>

  <!-- Title -->
  <text x="250" y="135" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Awesome Generative AI
  </text>
  <text x="250" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Contract Assistant ⚖️ ⚡
  </text>

  <!-- Subtitle -->
  <text x="250" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Ecosystem of Enterprise SaaS &amp; Open-Source Self-Hosted Legal AI Engines
  </text>
  <text x="250" y="246" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Contract Drafting • Redlining • Due Diligence • Playbook Verification • Local LLMs
  </text>

  <!-- Interactive/Feature Pills in Foreground -->
  <g transform="translate(250, 280)">
    <!-- Pill 1: Enterprise CLM -->
    <g class="pill" transform="translate(0, 0)">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏢 Enterprise CLM</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g class="pill" transform="translate(142, 0)">
      <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="67" y="21" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Self-Hosted OSS</text>
    </g>

    <!-- Pill 3: Word Tracked Changes -->
    <g class="pill" transform="translate(289, 0)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="75" y="21" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📝 DOCX Redlines</text>
    </g>

    <!-- Pill 4: Agentic Reasoning -->
    <g class="pill" transform="translate(451, 0)">
      <rect width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="82" y="21" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Agentic Reasoning</text>
    </g>
  </g>

  <!-- Sleek Accent Bottom Bar -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>
